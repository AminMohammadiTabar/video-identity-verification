spring:
  application:
    name: dms
  datasource:
    url: ${DMS_DB_URL:jdbc:postgresql://localhost:5432/video_identity_db}
    username: ${DMS_DB_USERNAME:vik_local}
    password: ${DMS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: dms
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: dms
    schemas: dms
    create-schemas: true
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

dms:
  storage:
    root: ${DMS_STORAGE_ROOT:./storage/dms}
  security:
    username: ${DMS_API_USERNAME:dms-admin}
    password: ${DMS_API_PASSWORD:}

server:
  # Preserve direct socket IP; trusted-proxy parsing is performed only by HttpAuditFilter.
  forward-headers-strategy: none
  port: ${SERVER_PORT:8081}

# API documentation is opt-in outside local development environments.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    try-it-out-enabled: false

# JSON access/audit logs: one event on entry and one on completion; no request bodies/secrets.
logging:
  structured:
    format:
      console: logstash
      file: logstash
  file:
    name: ${APP_LOG_FILE:./logs/dms.json.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 300MB
  level:
    com.example.videokyc: INFO

app:
  audit:
    # Comma-separated socket IPs of trusted reverse proxies. Empty by default to prevent XFF spoofing.
    trusted-proxies: ${AUDIT_TRUSTED_PROXIES:}
