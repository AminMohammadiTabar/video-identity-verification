# Optional convenience PostgreSQL for local development only; NOT production hardened.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: video_identity_db
      POSTGRES_USER: vik_local
      POSTGRES_PASSWORD: ${POSTGRES_LOCAL_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vik_local -d video_identity_db"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pg_local_data:
