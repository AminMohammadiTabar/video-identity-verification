spring:
  application:
    name: auth
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/video_identity_db}
    username: ${AUTH_DB_USERNAME:vik_local}
    password: ${AUTH_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: auth
    schemas: auth
    create-schemas: true
    baseline-on-migrate: false

server:
  # Preserve direct socket IP; trusted-proxy parsing is performed only by HttpAuditFilter.
  forward-headers-strategy: none
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

# API documentation is opt-in outside local development environments.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    try-it-out-enabled: false

# Bootstrapping ADMIN is opt-in; never seed a shared password.
auth:
  bootstrap:
    enabled: ${AUTH_BOOTSTRAP_ADMIN_ENABLED:false}
    admin-email: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}

# JSON access/audit logs: one event on entry and one on completion; no request bodies/secrets.
logging:
  structured:
    format:
      console: logstash
      file: logstash
  file:
    name: ${APP_LOG_FILE:./logs/auth.json.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 300MB
  level:
    com.example.videokyc: INFO

app:
  audit:
    # Comma-separated socket IPs of trusted reverse proxies. Empty by default to prevent XFF spoofing.
    trusted-proxies: ${AUDIT_TRUSTED_PROXIES:}
