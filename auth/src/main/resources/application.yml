spring:
  application:
    name: auth
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/video_identity_db}
    username: ${AUTH_DB_USERNAME:vik_local}
    password: ${AUTH_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: auth
    schemas: auth
    create-schemas: true
    baseline-on-migrate: false
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

server:
  # Preserve direct socket IP; trusted-proxy parsing is performed only by HttpAuditFilter.
  forward-headers-strategy: none
  port: ${SERVER_PORT:8080}
  tomcat:
    max-part-count: 8
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring.servlet.multipart:
  max-file-size: 50MB
  max-request-size: 52MB

# API documentation is opt-in outside local development environments.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    try-it-out-enabled: false

# Bootstrapping ADMIN is opt-in; never seed a shared password.
auth:
  dms:
    base-url: ${AUTH_DMS_URL:http://127.0.0.1:8081}
    username: ${AUTH_DMS_USERNAME:auth-service}
    password: ${AUTH_DMS_PASSWORD:}
  bootstrap:
    enabled: ${AUTH_BOOTSTRAP_ADMIN_ENABLED:false}
    admin-email: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}

# JSON access/audit logs: one event on entry and one on completion; no request bodies/secrets.
logging:
  structured:
    format:
      console: logstash
      file: logstash
  file:
    name: ${APP_LOG_FILE:./logs/auth.json.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 300MB
  level:
    com.example.videokyc: INFO

# Durable email outbox is always written on decisions; delivery is opt-in until SMTP is configured.
app:
  audit:
    # Comma-separated socket IPs of trusted reverse proxies. Empty by default to prevent XFF spoofing.
    trusted-proxies: ${AUDIT_TRUSTED_PROXIES:}
  notifications:
    email:
      enabled: ${EMAIL_NOTIFICATIONS_ENABLED:false}
      from: ${EMAIL_FROM:noreply@example.invalid}
      max-attempts: ${EMAIL_MAX_ATTEMPTS:8}
      poll-interval-ms: ${EMAIL_POLL_INTERVAL_MS:15000}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
    export:
      otlp:
        enabled: ${OTEL_EXPORTER_OTLP_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.namespace: video-identity-verification
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
          timeout: 10s
