# ==========================================
# Workflow Definitions
# ==========================================
DEFINITION_NOT_FOUND=Workflow definition not found with the specified ID.
DEFINITION_ARCHIVED=Workflow definition is archived; operations cannot be performed.
DEFINITION_NOT_ACTIVE=Workflow definition is not active; version publication is not allowed.
PENDING_PUBLICATION_EXISTS=A publication request is already pending for this workflow definition.
CANNOT_ARCHIVE_WITH_PENDING_PUBLICATION=Cannot archive definition while a version publication is pending.
INVALID_DEFINITION_NAME=Definition name must not be blank.
DEFINITION_NAME_TOO_LONG=Definition name must not exceed 200 characters.
INVALID_WORKFLOW_KEY=Workflow key is invalid.

# ==========================================
# Workflow Versions
# ==========================================
VERSION_NOT_FOUND=Workflow version not found with the specified ID.
VERSION_ALREADY_PUBLISHED=Workflow version is already published.
VERSION_ALREADY_ACTIVE=Workflow version is already active.
PUBLICATION_IN_PROGRESS=Publication is already in progress for this version.
INVALID_WORKFLOW_VERSION=Workflow version contains structural or semantic validation errors.
VERSION_NOT_EDITABLE=Only versions in DRAFT status are mutable.
INVALID_VERSION_NUMBER=Version number must be greater than zero.
ACTIVE_AND_PENDING_EQUAL=Active version ID and pending version ID cannot be the same.
INVALID_SNAPSHOT_SCHEMA_VERSION=Snapshot schema version must be greater than or equal to 1.
INVALID_SNAPSHOT_VERSION_NUMBER=Snapshot version number must be greater than or equal to 1.
MISSING_SNAPSHOT_DATA=Snapshot JSON and checksum must exist before publishing.
INVALID_VERSION_STATUS=Version status is invalid for the requested operation.

# ==========================================
# States & Transitions
# ==========================================
DUPLICATE_STATE_KEY=State key already exists in this version.
STATE_NOT_FOUND=State not found in this workflow version.
INVALID_STATE_NAME=State name must not be blank.
STATE_NAME_TOO_LONG=State name must not exceed 200 characters.
STATE_DESCRIPTION_TOO_LONG=State description must not exceed 1000 characters.
INVALID_DISPLAY_ORDER=Display order must be non-negative.
CANNOT_REMOVE_STATE_REFERENCED_BY_TRANSITION=Cannot remove state because transitions reference it.

DUPLICATE_TRANSITION_KEY=Transition key already exists in this version.
TRANSITION_NOT_FOUND=Transition not found in this workflow version.
INVALID_TRANSITION_NAME=Transition name must not be blank.
TRANSITION_NAME_TOO_LONG=Transition name must not exceed 200 characters.
TRANSITION_DESCRIPTION_TOO_LONG=Transition description must not exceed 1000 characters.
TRANSITION_FROM_FINAL_STATE=Transition cannot originate from a FINAL state.
INVALID_INITIAL_STATE_COUNT=Workflow version must have exactly one INITIAL state.
MISSING_FINAL_STATE=Workflow version must have at least one FINAL state.
ORPHANED_TRANSITION_ENDPOINT=Transition connects to an undefined state in this version.

# ==========================================
# Publication Jobs
# ==========================================
PUBLICATION_JOB_NOT_FOUND=No publication job found for the specified version.
INVALID_JOB_STATUS_FOR_RETRY=Can only retry a FAILED publication job.

# ==========================================
# Schema & Guard
# ==========================================
SCHEMA_VALIDATION_FAILED=Context schema validation failed.
GUARD_COMPATIBILITY_FAILED=Transition guard expression is incompatible with context schema.
GUARD_SYNTAX_ERROR=Syntax error in guard expression.
GUARD_EVALUATION_ERROR=Error evaluating transition guard.
INVALID_USER=User identifier must not be blank.
USER_TOO_LONG=User identifier must not exceed 128 characters.
INVALID_JSON=Invalid JSON format.
CANONICAL_SERIALIZATION_FAILED=Failed to serialize object canonically.
