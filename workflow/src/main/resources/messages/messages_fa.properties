# ==========================================
# Workflow Definitions
# ==========================================
DEFINITION_NOT_FOUND=تعریف گردش کار با شناسه مورد نظر یافت نشد.
DEFINITION_ARCHIVED=تعریف گردش کار در وضعیت بایگانی‌شده قرار دارد و امکان انتشار آن وجود ندارد.
DEFINITION_NOT_ACTIVE=تعریف گردش کار فعال نیست و امکان انتشار نسخه برای آن وجود ندارد.
PENDING_PUBLICATION_EXISTS=در حال حاضر یک درخواست انتشار در جریان برای این گردش کار وجود دارد.
CANNOT_ARCHIVE_WITH_PENDING_PUBLICATION=به دلیل وجود نسخه در حال انتشار، امکان بایگانی تعریف گردش کار وجود ندارد.
INVALID_DEFINITION_NAME=نام تعریف گردش کار نامعتبر یا خالی است.
DEFINITION_NAME_TOO_LONG=نام تعریف گردش کار نمی‌تواند بیش از 200 کاراکتر باشد.
INVALID_WORKFLOW_KEY=شناسه کلید گردش کار نامعتبر است.

# ==========================================
# Workflow Versions
# ==========================================
VERSION_NOT_FOUND=نسخه گردش کار با شناسه مورد نظر یافت نشد.
VERSION_ALREADY_PUBLISHED=این نسخه از گردش کار قبلاً منتشر شده است.
VERSION_ALREADY_ACTIVE=این نسخه در حال حاضر نسخه فعال گردش کار است.
PUBLICATION_IN_PROGRESS=عملیات انتشار برای این نسخه در حال انجام است.
INVALID_WORKFLOW_VERSION=نسخه گردش کار از نظر ساختاری نامعتبر است.
VERSION_NOT_EDITABLE=تنها نسخه‌های در وضعیت پیش‌نویس (DRAFT) قابل ویرایش هستند.
INVALID_VERSION_NUMBER=شماره نسخه باید بزرگتر از صفر باشد.
ACTIVE_AND_PENDING_EQUAL=نسخه فعال و نسخه در حال انتظار نمی‌توانند یکسان باشند.
INVALID_SNAPSHOT_SCHEMA_VERSION=نسخه اسکیمای اسنپ‌شات نامعتبر است.
INVALID_SNAPSHOT_VERSION_NUMBER=شماره نسخه اسنپ‌شات نامعتبر است.
MISSING_SNAPSHOT_DATA=داده‌های اسنپ‌شات و چک‌سام قبل از انتشار باید ایجاد شده باشند.
INVALID_VERSION_STATUS=وضعیت نسخه برای این عملیات نامعتبر است.

# ==========================================
# States & Transitions
# ==========================================
DUPLICATE_STATE_KEY=کلید حالت در این نسخه تکراری است.
STATE_NOT_FOUND=حالت مورد نظر در این نسخه یافت نشد.
INVALID_STATE_NAME=نام حالت نامعتبر یا خالی است.
STATE_NAME_TOO_LONG=نام حالت نمی‌تواند بیش از 200 کاراکتر باشد.
STATE_DESCRIPTION_TOO_LONG=توضیحات حالت نمی‌تواند بیش از 1000 کاراکتر باشد.
INVALID_DISPLAY_ORDER=ترتیب نمایش باید عدد نامنفی باشد.
CANNOT_REMOVE_STATE_REFERENCED_BY_TRANSITION=امکان حذف این حالت وجود ندارد زیرا انتقال‌هایی به آن وابسته هستند.

DUPLICATE_TRANSITION_KEY=کلید انتقال در این نسخه تکراری است.
TRANSITION_NOT_FOUND=انتقال مورد نظر در این نسخه یافت نشد.
INVALID_TRANSITION_NAME=نام انتقال نامعتبر یا خالی است.
TRANSITION_NAME_TOO_LONG=نام انتقال نمی‌تواند بیش از 200 کاراکتر باشد.
TRANSITION_DESCRIPTION_TOO_LONG=توضیحات انتقال نمی‌تواند بیش از 1000 کاراکتر باشد.
TRANSITION_FROM_FINAL_STATE=انتقال نمی‌تواند از حالت نهایی (FINAL) مبدا بگیرد.
INVALID_INITIAL_STATE_COUNT=گردش کار باید دقیقاً دارای یک حالت اولیه (INITIAL) باشد.
MISSING_FINAL_STATE=گردش کار باید حداقل دارای یک حالت نهایی (FINAL) باشد.
ORPHANED_TRANSITION_ENDPOINT=انتقال به حالتی که در این نسخه تعریف نشده متصل است.

# ==========================================
# Publication Jobs
# ==========================================
PUBLICATION_JOB_NOT_FOUND=جاب انتشار برای نسخه مورد نظر یافت نشد.
INVALID_JOB_STATUS_FOR_RETRY=فقط جاب‌های با وضعیت ناموفق (FAILED) قابل تلاش مجدد هستند.

# ==========================================
# Schema & Guard
# ==========================================
SCHEMA_VALIDATION_FAILED=اعتبارسنجی اسکیمای زمینه با شکست مواجه شد.
GUARD_COMPATIBILITY_FAILED=شرط انتقال (گارد) با اسکیمای زمینه سازگار نیست.
GUARD_SYNTAX_ERROR=خطای نحوی در ساختار عبارت گارد.
GUARD_EVALUATION_ERROR=خطا در ارزیابی گارد گردش کار.
INVALID_USER=شناسه کاربر نامعتبر یا خالی است.
USER_TOO_LONG=شناسه کاربر نمی‌تواند بیش از 128 کاراکتر باشد.
INVALID_JSON=رشته ورودی با فرمت JSON معتبر نیست.
CANONICAL_SERIALIZATION_FAILED=خطا در نرمال‌سازی و سریال‌سازی استاندارد داده JSON.
