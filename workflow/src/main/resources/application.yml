spring:
  application:
    name: workflow
  datasource:
    url: ${WORKFLOW_DB_URL:jdbc:postgresql://localhost:5432/video_identity_db}
    username: ${WORKFLOW_DB_USERNAME:vik_local}
    password: ${WORKFLOW_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: workflow
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: workflow
    schemas: workflow
    create-schemas: true
    baseline-on-migrate: false

server:
  # Preserve direct socket IP; trusted-proxy parsing is performed only by HttpAuditFilter.
  forward-headers-strategy: none
  port: ${SERVER_PORT:8082}

# API documentation is opt-in outside local development environments.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    try-it-out-enabled: false

# JSON access/audit logs: one event on entry and one on completion; no request bodies/secrets.
logging:
  structured:
    format:
      console: logstash
      file: logstash
  file:
    name: ${APP_LOG_FILE:./logs/workflow.json.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 300MB
  level:
    com.example.videokyc: INFO

app:
  audit:
    # Comma-separated socket IPs of trusted reverse proxies. Empty by default to prevent XFF spoofing.
    trusted-proxies: ${AUDIT_TRUSTED_PROXIES:}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
    export:
      otlp:
        enabled: ${OTEL_EXPORTER_OTLP_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.namespace: video-identity-verification
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
          timeout: 10s
